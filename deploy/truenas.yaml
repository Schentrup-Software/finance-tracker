# TrueNAS SCALE 24.10+ (Docker apps):
#   Apps > Discover Apps > ⋮ next to Custom App > Install via YAML
# Name the app "finance-tracker", paste this file, and save.
# Full instructions: docs/truenas.md
#
# Change /mnt/tank/... below to a dataset on YOUR pool (Datasets shows the
# pool's name). The container makes the folder belong to the "apps" user
# (ID 568, set by PUID/PGID) and then runs as that user.

services:
  finance-tracker:
    image: ghcr.io/schentrup-software/finance-tracker:latest
    pull_policy: always
    ports:
      - "30680:8080" # host:container - change the left side if 30680 is taken
    volumes:
      - /mnt/tank/apps/finance-tracker/pb_data:/pb/pb_data
    environment:
      PUID: "568"
      PGID: "568"
      # Optional: an OpenClaw agent reads paystubs the built-in reader can't.
      # See docs/truenas.md. Remove the # on these two lines to turn it on.
      # OPENCLAW_URL: "http://192.168.1.20:18789"
      # OPENCLAW_TOKEN: "your-gateway-token"   # not needed behind a trusted proxy
      # OPENCLAW_USERNAME: "proxy-user"        # if a proxy in front of OpenClaw asks for a basic login
      # OPENCLAW_PASSWORD: "proxy-password"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
